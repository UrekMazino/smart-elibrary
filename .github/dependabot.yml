# Dependabot opens pull requests when PHP, npm or GitHub Actions dependencies have updates.
# Minor/patch bumps are grouped into one PR per ecosystem so they don't pile up; security fixes
# also come through Dependabot alerts (Settings → Code security → Dependabot alerts + security updates).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      php-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
