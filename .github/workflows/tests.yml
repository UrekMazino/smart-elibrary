# PHPUnit on every push and pull request, against the job's own throwaway MySQL — never a real
# database. phpunit.xml points tests at elibrarydb_test and tests/TestCase.php refuses anything else,
# so the service container below creates exactly that database.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: elibrarydb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath, exif
          tools: composer:v2
          coverage: none
      - name: Install PHP packages
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run the test suite
        run: vendor/bin/phpunit
